# tests/pkg/perm, with the [tools] table removed: the control object.
#
# `[deps]` is a library that declares `net`; `[tools]` is a tool that declares
# `fs.read workspace` and `net`. Both are resolved by ONE MVS graph and both
# land in mc.lock; only the library is an include root, and `mc build` never
# opens the tool's tree (tests/pkg/perm/notools.toml is the same project with
# the `[tools]` table removed, and the two objects are byte for byte the same).
[project]
name  = "perm"
entry = "main.mc"
out   = "build/perm-nt.o"
kind  = "obj"

[deps]
net = "1.0.0"

[limits]
tolerance = 1.0
