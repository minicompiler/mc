# mc.toml - mcsite built by `mc build`, with no make and no ld:
#
#   build/mc1 build site        # from the repository root
#   build/mc1 build             # from inside site/
#
# One step: site/gen/main.mc compiled by the running compiler into a signed
# executable (the built-in macho-exe backend, M11). There is no [compiler]
# section because mcsite teaches the compiler nothing - it USES the compiler's
# own lexer, through `#include <mc/lex>` from the bundle inside the binary.

[project]
name  = "mcsite"
entry = "gen/main.mc"
out   = "../build/mcsite"
kind  = "exe"

# No [target]: with the section absent `mc build` takes the pair of the HOST it
# is running on (M37), so this one file builds a Mach-O executable on macOS and
# an ELF one on Linux -- since M42 with no linker and no sysroot on either.
#
# The [include] root is what picks mcsite's host layer, gen/macos/site_host.mc
# or gen/linux/site_host.mc: the `struct dirent` offsets are the one thing the
# two systems do not share. site/mc.linux.toml is this file with gen/linux.
[include]
paths = ["gen/macos"]
