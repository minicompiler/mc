# Promote pending canary releases — the scheduled backstop for
# docs/ci.md § The canary (M53). `release.yml`'s own `promote` job polls for
# at most 15 minutes and then defers: teko's own schedule for noticing a
# pre-release and writing a verdict is not bounded by anything mc controls
# (GitHub throttles a `schedule` trigger on a quiet repository the same way it
# throttled teko's — measured on v1.1.0, whose verdict landed at 05:19Z, 90
# minutes after the in-run job had already given up; see
# docs/specs/M53.md § 6 for the timestamps). Without something that keeps
# asking, a release whose canary answers late sits as a pre-release until a
# human runs `gh release edit --prerelease=false --latest` by hand.
#
# This workflow is that something: it asks ONCE per pending pre-release (no
# polling loop of its own — `scripts/canary-poll.sh --once` is exactly one
# lookup) and it itself runs on a fixed schedule, forever, with no timeout on
# how long a release may stay pending. No credential crosses the repository
# boundary here either, in either direction: it reads the SAME public verdict
# file `canary-poll.sh` always reads, and any token it uses (mc's own
# GITHUB_TOKEN) only raises mc's own rate limit against GitHub's public API —
# it is never sent to, or accepted from, the consumer's repository.
#
# GitHub throttles `schedule` on a quiet repository, which is exactly why
# every run here has to be safe to skip, safe to repeat, and safe to run late:
# it always re-derives "which releases are pending" from the live release
# list, never from memory of a previous run, so a missed or delayed run costs
# nothing but time.
name: Promote pending canary releases

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Only check this tag (vX.Y.Z); default checks every pending pre-release"
        required: false
        type: string
      dry_run:
        description: "Print what would be promoted/announced, touch nothing"
        required: false
        default: false
        type: boolean

concurrency:
  group: promote-pending
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Reads the live release list, asks each pending pre-release's verdict ONCE,
  # and promotes the ones that answered `ok`. Outputs the list of tags it
  # actually promoted this run, so `announce` below can tell the registry
  # about exactly those and nothing else.
  sweep:
    name: Ask each pending release's verdict, once
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      promoted: ${{ steps.sweep.outputs.promoted }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Sweep every pending release
        id: sweep
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_INPUT: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          CANARY_REPO: ${{ vars.MC_CANARY_REPO }}
        run: |
          set -eu
          if [ -n "${TAG_INPUT:-}" ]; then
            tags=$TAG_INPUT
          else
            # Every plain-semver pre-release, the same shape `release.yml`'s
            # own `case "$VERSION" in *-*)` recognizes: no draft, no
            # hand-pushed `-suffix` release-candidate tag (those are outside
            # the canary by design -- docs/ci.md § Versioning).
            tags=$(gh release list --limit 100 \
                   --json tagName,isPrerelease,isDraft \
                   --jq '.[] | select(.isPrerelease and (.isDraft | not))
                              | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))
                              | .tagName')
          fi
          if [ -z "${tags:-}" ]; then
            echo "promote-pending: no pending pre-release"
            echo "promoted=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          promoted_json='[]'
          for tag in $tags; do
            echo "::group::$tag"
            rc=0
            sh scripts/canary-poll.sh --once "$tag" || rc=$?
            case "$rc" in
            0)
              echo "promote-pending: $tag -- verdict ok"
              if [ "${DRY_RUN:-false}" = "true" ]; then
                echo "promote-pending: would run: gh release edit $tag --prerelease=false --latest"
              else
                gh release edit "$tag" --prerelease=false --latest
                echo "promote-pending: $tag is no longer a pre-release"
                promoted_json=$(printf '%s' "$promoted_json" | jq -c --arg t "$tag" '. + [$t]')
              fi
              ;;
            1)
              # The release is already correctly a pre-release; a failed
              # canary is not this workflow's to report twice (each run
              # re-checks and re-warns, which is acceptable and simple: see
              # the header comment on idempotence).
              echo "::warning::promote-pending: $tag -- canary verdict is fail, staying a pre-release"
              ;;
            *)
              echo "promote-pending: $tag -- no verdict yet"
              ;;
            esac
            echo "::endgroup::"
          done
          echo "promoted=$promoted_json" >> "$GITHUB_OUTPUT"

  # A separate job, matrixed over whatever `sweep` actually promoted this run,
  # because a `uses:` step cannot be invoked in a shell loop and this is a
  # per-tag action call with its own inputs. It duplicates release.yml's
  # `publish-to-registry` single step rather than re-running the release
  # itself: `gh workflow run release.yml` was considered and rejected -- it
  # would rebuild every platform's binary from scratch to announce a tag that
  # already has a published, verified release, which is exactly the "rebuild
  # everything" cost this workflow exists to avoid. Converting
  # `publish-to-registry` into a reusable `workflow_call` job so both
  # workflows share one definition is a cleaner shape for later; duplicating
  # this one lightweight step (which itself does the real work server-side,
  # inside the registry's own sandbox) is the pragmatic choice here, with the
  # same inputs release.yml uses and no token of its own.
  #
  # Never runs in a dry run, whatever MC_REGISTRY_PUBLISH says: `sweep` leaves
  # `promoted` at `[]` under `dry_run`, since nothing was actually promoted.
  announce:
    name: Announce the promoted releases to the registry
    needs: sweep
    if: needs.sweep.outputs.promoted != '[]' && vars.MC_REGISTRY_PUBLISH == 'true'
    strategy:
      matrix:
        tag: ${{ fromJson(needs.sweep.outputs.promoted) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    continue-on-error: false
    steps:
      - uses: minicompiler/register-action@v1
        with:
          tag: ${{ matrix.tag }}
