# mc.toml -- the repository, as the package `mc`.
#
# This file makes minicompiler/mc a package the registry can publish: M44's
# amendment D15' says the package `mc` is THE WHOLE BUNDLE at the compiler's
# version, so `files` below is every path in tools/bundle.list, plus the two
# files that list cannot name (see the comment on `files`).
#
# It carries NO [project]. `mc build` is not how this repository is built --
# `make` is -- and the five real project configs are src/mc.<target>.toml, one
# per cross target. A [project] here would also make the registry's validator
# run the compiler with no arguments, which prints usage and exits 1.
# So `mc build .` at the root is `mc.toml: missing key: project.entry`, on
# purpose; nothing in this repository runs it.
#
# See docs/reference/packages.md § The `mc` package.

[package]
name = "mc"

# What a bare `#include <mc>` means: the compiler without `user_init`, which is
# what every taught compiler includes and what [compiler].core defaults to
# (`<mc/core>`). src/core.mc reaches the rest of the tree with quoted relative
# includes, so the package tree serves it as the repository does.
lib = "src/core.mc"

# The translation units the registry's validator compiles inside its box, each
# on its own (docs/specs/M47-S5.md § 3: the lib alone needs a host layer first,
# and the bundle carries alternatives -- two host layers, two system layers --
# that cannot share one unit). The box is linux/x86_64. The compiler ignores
# this key; the registry reads it (spec M47 § 22).
check = ["src/mc_linux_x86_64.mc"]

# Generated from tools/bundle.list -- `cut -f2 tools/bundle.list | LC_ALL=C sort -u`
# (byte order: under a UTF-8 locale macOS collates `_` before `.`, and the
# manifest order is what the tree hash is over) -- plus two files that list
# cannot carry and the tree is useless without:
#
#   src/bundle_data.mc  the blob. The bundle cannot contain itself, so it has no
#                       bundle.list row; src/core_bundle.mc includes it by path.
#   tools/bundle.list   the NAME<TAB>PATH map. `#include <name>` served from an
#                       installed tree (packages.md § 2, step 3) reads it.
#
# scripts/check-pkg.sh regenerates this array and fails when it drifts.
files = [
    "lib/backend_arm64.mc",
    "lib/f16.mc",
    "lib/float.mc",
    "lib/float_rt.mc",
    "lib/i128.mc",
    "lib/io.mc",
    "lib/machine_arm64_float.mc",
